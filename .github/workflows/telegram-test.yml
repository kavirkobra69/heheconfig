name: Telegram connection test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test connection (Saved Messages) or send to a Telegram ID"
        required: true
        type: choice
        options:
          - connection
          - send_message
      target_id:
        description: "Target numeric ID or public @username (only for send_message)"
        required: false
        type: string
      message:
        description: "Message to send"
        required: true
        default: "✅ اتصال تلگرام از GitHub Actions موفق است."
        type: string

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check "Telethon>=1.40,<2"

      - name: Test Telegram connection or send message
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TEST_MODE: ${{ inputs.mode }}
          TARGET_ID: ${{ inputs.target_id }}
          TEST_MESSAGE: ${{ inputs.message }}
        run: python scripts/telegram_test.py
