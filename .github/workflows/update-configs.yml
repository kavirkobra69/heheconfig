name: Update Telegram configs

on:
  schedule:
    # Every three hours; offset from the top of the hour to reduce queue delays.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_telegram_configs.py"
      - "telegram_channels.txt"
      - ".github/workflows/update-configs.yml"

permissions:
  contents: write

concurrency:
  group: telegram-config-updater
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check "Telethon>=1.40,<2"

      - name: Collect configs from Telegram channels
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/collect_telegram_configs.py

      - name: Commit updated JSON if changed
        run: |
          if git diff --quiet -- configs.json; then
            echo "No config changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.json
          git commit -m "chore: update Telegram configs"
          git push
