name: Update Telegram configs

on:
  schedule:
    # Every six hours; offset from the top of the hour to reduce queue delays.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-config-updater
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs from public Telegram channels
        run: python scripts/collect_telegram_configs.py

      - name: Commit updated JSON if changed
        run: |
          if git diff --quiet -- configs.json; then
            echo "No config changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.json
          git commit -m "chore: update Telegram configs"
          git push
