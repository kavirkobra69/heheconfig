name: Build Telegram Import APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout custom patches
        uses: actions/checkout@v4

      - name: Checkout upstream v2rayNG
        run: git clone --depth 1 --recurse-submodules https://github.com/2dust/v2rayNG.git upstream

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        shell: bash
        run: |
          yes | sdkmanager --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Telegram import changes
        run: python3 scripts/apply_patches.py

      - name: Build native libhevtun
        working-directory: upstream
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          if [ -d libs ]; then cp -r libs/. V2rayNG/app/libs/; fi

      - name: Find AndroidLibXrayLite release tag
        working-directory: upstream/AndroidLibXrayLite
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: 'upstream/V2rayNG/app/libs/'

      - name: Build debug APK
        working-directory: upstream/V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-telegram-import-apks
          path: upstream/V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
